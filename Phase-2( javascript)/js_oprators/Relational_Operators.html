<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- Ye operators do values ka relation compare karte hain
Result hamesha true ya false hota hai -->

<h3>Greater Than (>)</h3>
<!-- Check karta hai left value badi hai ya nahi -->

<p id="gt"></p>

<script>
let a = 20;
let b = 18;
document.getElementById("gt").innerHTML = (a > b);
</script><hr/>

<!-- =========================================================================================== -->

<h3>Less Than (<)</h3>
<!-- Check karta hai left value chhoti hai ya nahi -->

<p id="lt"></p>

<script>
let x = 10;
let y = 15;
document.getElementById("lt").innerHTML = (x < y);
</script><hr/>

<!-- ====================================================================================== -->

<h3>Greater Than or Equal (>=)</h3>
<!--  Ya to bada ho ya equal ho -->
  
<p id="gte"></p>

<script>
let marks = 50;
document.getElementById("gte").innerHTML = (marks >= 50);
</script><hr/>

<!-- ===================================================================================== -->

<h3>Less Than or Equal (<=)</h3>
<!-- Ya to chhota ho ya equal ho -->

<p id="lte"></p>

<script>
let time = 8;
document.getElementById("lte").innerHTML = (time <= 9);
</script>

</body>
</html>
