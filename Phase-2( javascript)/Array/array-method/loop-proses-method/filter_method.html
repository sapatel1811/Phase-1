<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <p> filter() : condition ke hisab se element deta hy </p>
<script>
    let numbers =[1,2,3,4,5];
    let even = numbers.filter(num => num % 2===0);
    console.log(even);
    document.write(even);
</script>
</body>
