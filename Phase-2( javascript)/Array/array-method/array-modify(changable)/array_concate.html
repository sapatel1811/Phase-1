<!-- => array concate matlab 2 y 2 se jada array ko jodna 
=> ye origanal array ko change nahi karta 
=> ye new array return karta hy 
* basic syntex: array1.concat(array2,array3....)
-->
<h3>Simple example :</h3>
<script>
    let arr1 =[1,2,3];
    let arr2 =[4,5,6];
    let result = arr1.concat(arr2);
    console.log(result);
    document.write(result);
</script>

let b = [2];
let c = [3];

let resultt= a.concat(b, c);

console.log(resultt);
document.write(resultt);
