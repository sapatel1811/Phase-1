<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<p>1) Push() : End me value add karna</p>
 <script>
    let arr = [10,20];
    arr.push(30);
    console.log(arr);
    document.write(arr + "<br>");
 </script><hr>

 <!-- =============================================================================== -->

<p>2) pop() : last me value remove karna</p>
<script>
    let num =[1,2,3,4,5];
    num.pop();
    console.log(num);
    document.write(num);
</script><hr>

<!-- ====================================================================================== -->

<p>3) shift() : first value remove karta hy </p>
<script>
    let color =["red","blue","black","white"];
    color.shift();
    console.log(color);
    document.write(color);
</script><hr>

<!-- =================================================================================== -->

<p>4) unshift(): start me value add karta hy</p>
<script>
    let pet =["dog","cat","mouse","lion"];
    pet.unshift();
    console.log(pet);
    document.write(pet);
</script><hr>

</body>
</html>
