<!DOCTYPE html>
<html lang="en">

<body>

<!-- =>lastindexOf : array me kisi elemnt ka last index return karta hy 
=> if value na mile => -1 return karta hy -->

<h3>1) simple example:</h3>
<script>
    let fruit =["apple","banana","mango"];
    console.log(fruit.lastIndexOf("banana"));
    document.write(fruit.lastIndexOf("banana"));
</script>

<!-- ================================================================================== -->

<h3>2) dublicate value:</h3>
<script>
    let fruits =["mango","lichi","mango","apple","mango","banana","lichi"];
    document.write(fruits.lastIndexOf("mango"));
</script>

<!-- ================================================================================= -->

<h3>3) check last position:</h3>
<script>
    let color =["red","black","white","yellow"];
    document.write(color.lastIndexOf("white"));
</script>


</body>
</html>
