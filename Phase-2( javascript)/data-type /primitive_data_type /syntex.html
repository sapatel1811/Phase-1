<!-- * js me primitive data ype wo hote hy jo :
=> simple value store karte hy

=> copy by value hote hy
* js me 7 primitive data hote hy:

<!-- 1) number : ye integer , decimal , nagitive sab ho sakta hy  -->
 <script>
    let age =  21;
    let prise = 99.99;
    let temp = -10;
    console.log(typeof age);
    document.write(typeof age);
 </script><br>

 <!-- => infinity be number hay

str[0] = "Y";
