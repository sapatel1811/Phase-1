<!DOCTYPE html>
<html>
<head>
<title>Document</title>
</head>

<body>

<h2>User Data:</h2>

<table border="1">
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Username</th>
<th>Street</th>
<th>City</th>
<th>Zipcode</th>
<th>Company</th>
</tr>
</thead>

<tbody id="tableData"> 
</tbody>
</table>

<script>
let table = document.getElementById("tableData");

fetch("https://jsonplaceholder.typicode.com/users")
.then(function(response){
    return response.json();
})
.then(function(data){
data.forEach(function(user){
let row = `
        <tr>
        <td>${user.id}</td>
        <td>${user.name}</td>
        <td>${user.email}</td>
        <td>${user.username}</td>
        <td>${user.address.street}</td>
        <td>${user.address.city}</td>
        <td>${user.address.zipcode}</td>
        <td>${user.address.company}</td>
        </tr>
        `;
table.innerHTML += row;
});
})

</script>

</body>
</html>
