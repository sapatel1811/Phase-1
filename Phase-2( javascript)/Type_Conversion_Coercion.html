<!-- => Jab developer khud se data type change karta hai
=> Isko Explicit Conversion bhi kehte hain
Common methods:
* Number()
* String()
* Boolean()
* parseInt()
* parseFloat()
     -->
<!DOCTYPE html>
<html>
<body>

<h3>Type Conversion vs Type Coercion</h3>
<p id="out1"></p>
<p id="out2"></p>

<script>
let a = "20";

// Type Conversion
let b = Number(a);
document.getElementById("out1").innerHTML =
"Conversion: " + b + " (" + typeof b + ")";

// Type Coercion
let c = a + 5;
document.getElementById("out2").innerHTML =
"Coercion: " + c + " (" + typeof c + ")";
</script>

</body>
</html>

</body>
