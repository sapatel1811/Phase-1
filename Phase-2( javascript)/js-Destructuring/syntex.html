<body>

<!-- => it means array ya object ke value ko directly variable me nikal lena bina 
alag alg indexing ya dot notation use kiye . 
=> data ko tod ke (sturcture ko break kar ke ) variable me dalna . -->
<script>
    let student ={ //object
        name:"sapna",
        age:23,
        course:"forntend"
    };
    let {name,age}= student; // name age se hamne object ke ander ki value directly variable se nikal li
    console.log(name);
    console.log(age);
    document.write(name + "<br>");
    document.write(age);
</script>
