<!DOCTYPE html>
<html>
<body>

<!-- variable declare -> 3 type :

1) var => Old method (ES5 se pehle)
=> Function scoped hota hai
=> Redeclare & reassign allowed
=> Hoisting hoti hai -->


<h3>1) Var: Function scoped</h3>
<p id="out1"></p>
<p id="out2"></p>
<p id="out3"></p>
<script>
      var name = "sapna";
      var age = 22;
      var isstudent = true;
      document.getElementById("out1").innerHTML = name ;
      document.getElementById("out2").innerHTML = age;
      document.getElementById("out3").innerHTML = isstudent;
</script>
<hr/>

<!-- 2)let => let block scoped hota ha
=> Same scope me dobara declare nahi kar sakte
=> Reassign kar sakte ho -->

<h3> Let : block scoped</h3>
<table border="1">
  <tr><th>Key</th><th>Value</th></tr>
  <tr><td>car</td><td id="n"></td></tr>
  <tr><td>price</td><td id="a"></td></tr>
</table>

<script>
  let car = "Mg";
  let price  = 340000;

  document.getElementById("n").innerHTML = car;
  document.getElementById("a").innerHTML = price;
</script>
<hr/>

<!-- 3) const => Declaration ke time value dena zaroori.
=> Reassign nahi kar sakte -->

<h3>3) const:  block scope</h3>
<div id="result"></div>

<script>
  const a = 10;
  const b = 20;

  document.getElementById("result").innerHTML += "A = " + a + "<br>";
  document.getElementById("result").innerHTML += "B = " + b + "<br>";
</script>

</body>
</html>
