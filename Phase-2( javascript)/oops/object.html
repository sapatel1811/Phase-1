<script>
    function student(name,age){
        this.name = name;
        this.age = age;
    }
    let s1 = new student("sp",20);
    let s2 = new student("ps",26);
    document.write(s1.name );
    document.write(s2.age);
</script><br><br>

<!-- ================================================================================== -->

<!-- * constructer me method add karna : -->
 <script>
    function car(brand , color){
        this.brand = brand;
        this.color = color;
        this.start = function (){
            document.write(this.brand + "car started");
        }
    }
    let c1 = new car ("toyta","black");
    c1.start();
 </script>

 <!-- =============================================================================== -->
