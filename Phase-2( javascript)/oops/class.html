    class car{
        constructor(brand,color){
            this.brand = brand;
            this.color = color;
        }
        start(){
            document.write(this.brand + "car started");
        }
    }
    let c1 = new car("MG Hector","Black");
    let c2 = new car("BMW","white");

    c1.start();
    c2.start();
