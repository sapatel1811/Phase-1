<!-- => ek class dusri class ke properties or method use kar skate hy 
=> means child class prent class ke feature ko inherit kar skti hy
=> isse code resuse hota hy or code chota and clean ho jata hy
* inheritance : ek class ka dusri class ke properties or method ko use karna.  -->

<!-- * syntex: class Parent {
}
class Child extends Parent {
} -->

<script>
    class Animal{ //animal: perent class
        eat(){
            console.log("animal is eating");
        }
    }
    class dog extends Animal{ // dog: child class
        bark(){
            document.write("dog is barking"); 
        }
    }
    let d1 = new dog();
    d1.eat();
    d1.bark();
</script><br><br>

<!-- * construter inheritance example : -->
 <script>
        class Person {

  constructor(name){
    this.name = name;
  }

  showName(){
    console.log(this.name);
    document.write(this.name);
  }

}

class Student extends Person {

  constructor(name, course){
    super(name);
    this.course = course;
  }

  showCourse(){
    console.log(this.course);
    document.write(this.course);
  }

}

let s1 = new Student("Rahul","JavaScript");

s1.showName();
s1.showCourse();
 </script><br><br>

<!-- 2) multipal inheritance: 
=> jab ek child class ek se jada perent class ke properties and method ko inherit kare.
* imp :
=> js me classes direct multipal inheritance suport nahi karti.

=> class child extend perent1,perent2 (esa direct nahi likh skate hy) 

* perent-1       perent-2
        \         /
        child class
-->

<script>
    class person{
        walk(){
            document.write("person can walk");
        }
    }
    class student{
        study(){
            document.write("student can study");
        }
    }
    class boy {}
    Object.assign(boy.prototype,person.prototype,student.prototype);

    let b1 = new boy();
    b1.walk;
    b1.study;
</script>
