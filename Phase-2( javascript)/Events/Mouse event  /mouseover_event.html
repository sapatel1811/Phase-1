<!--===================================================================================  -->

<script>
    function changeStyle(){
        let btn = document.querySelector("button");
        btn.style.backgroundColor = "green";
        btn.style.color = "white";
        btn.style.fontSize = "20px";
    }
</script>
<button onmouseover="changeStyle()">Change Style</button>  


</body>
