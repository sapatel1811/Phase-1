<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<!-- touch move event : jab user screen ko touch karke move karta hay to ye event trigger hoat hay.
(touch ki movement ).
=> ye bilkul mouse ke mouse move event jesa hy => lekin mobile ke liye . -->

<style>
    #box {
        width: 100px;
        height: 100px;
        background: blue;
    }
</style>
<div id="box"></div>
<script>
    const box = document.getElementById("box");

    // Touch Move
    box.addEventListener("touchmove", function() {
        box.style.background = "yellow";
        console.log("Touch Move");
    });
</script>


</body>
</html>
