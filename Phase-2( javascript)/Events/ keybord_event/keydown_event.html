<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<!-- keydown event => jab user koi key press karta hy to ye event trigger hota hy  
=> is event ke sath hum event handler function ko jod sakte hy jise event ke hone
 par call kiya jata hy.
syntax : <element onkeydown="handlerFunction()">
    => element : html element jisme event add karna hai
    => onkeydown : event ka naam
    => handlerFunction() : function jo event ke hone par call hoga 
-->
<input type="text" onkeydown="handleKeyDown(event)" placeholder="Type something...">
<script>
    function handleKeyDown(event){ 
        console.log("Key pressed: " + event.key);
    }
</script>

<!-- ================================================================================== -->

<script>
    document.querySelector('input').addEventListener('keydown', function(event){
        console.log("Key pressed using addEventListener: " + event.key);
    });
</script> 

</body>
</html>
