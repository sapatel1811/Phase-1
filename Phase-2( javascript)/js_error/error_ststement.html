<!-- ================================================================================ -->

 <!-- 1) try statement : try block me wo code likhte hy jisme error ane ke posibility 
  hoti hy  -->

  <!-- <script>

  </script> -->

<!-- => ager error ata hy to control catch block me chla jata hy -->
 <script>

        let a = b =10;

        document.write("error aa gya ");
    }
 </script>

<!-- ================================================================================= -->

<!-- 2) catch ststement : catch block error ko catch(handle)karta hy -->
 <script>
    try {
  console.log(a);
}
catch(error){
  console.log("Error occurred");
}
 </script>
<!-- => a : variable define nahi hy -> rfrence error ata hy ,lekin catch usko 
 hendle kar leta hy -->

<!-- =================================================================================== -->

<!-- 3)try + catch : -->
<script>
try {
  let num = 10;
  num.toUpperCase();
}
catch(error){
  console.log("Type error occurred");
}
</script> 

<!-- =============================================================================== -->

<!-- 4) finaly ststemenet : ye always run hota hy fir cahe error aye ya nhai  -->
<script>
    let age = 15;
try {
  if(age < 18){
     throw "You are not eligible";
  }
}
catch(error){
  console.log(error);
}
</script>

=> isme ham error object ko use nahi karte, serf error ane par direct execute kar dete hy  -->

<!-- try {

<!-- * importrnt point : 
=> catch bina perameter ke be likh sakte hy 
=> jab error ka details use nahi karna ho to unconditinal catch use karte hy  -->

<!-- ================================================================================== -->

<!-- 6) conditinaol catch block : catch block me error object ko use kar ke condition check karna 
=> isme ham diffrent type ke error ke liye alag lag cony ko use kar skate hy  -->

<!-- * syntex :  -->
<script>
    try {
  // risky code
}
catch(error) {

  if(error instanceof TypeError){
    console.log("Type Error aaya hai");
  }
  else if(error instanceof ReferenceError){
    console.log("Reference Error aaya hai");
  }
  else{
    console.log("Koi aur error hai");
  }
}
</script>

<!-- ============================================== -->
<!-- * refrence error : -->

<script>  
try {
  let a = b + 10;   // b define nahi hai
}
catch(err){

  if(err instanceof ReferenceError){
    document.write("Reference Error aaya hai");
  }

  else{
    document.write("Koi aur error hai");
  }

}
</script>
