<!-- => pure function : yeh hamesha same inpute leke same outpute deta hy 
=> bahr ki chize change nahi karta (no side effect)  

RLE : 2 cup chai = same test hamesha 
=> kictan ke bahr ka saman change nahi hota 
=-> recipe fixed = output fixed -->

<!-- ======================================================================================= -->

<!-- pure function simple  -->
 <script>
    function add(a, b) {
  return a + b;
}
add(2, 3); // 5
add(2, 3); // 5 (same result)
 </script> 

<!-- ======================================================================================== -->

<!-- pure function with variable  -->
<script>
    function square(n) {
  return n * n;
} // no global variable , no console , no dom change 
</script>


</body>
