        function greet(){

<!-- name function with perameter -->

<script>
    function greet(name){
    console.log("Hello " + name);
}

greet("sp"); // hello sp -> print

<!-- name function with defult perameter  -->
<script>
    function greet(name = "Guest"){
    return "Hello " + name;
}

console.log(greet()); // defult use 
console.log(greet("Sapna"));
</script>
