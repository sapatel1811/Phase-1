<!-- Anonymous function store in variable  -->
<script>
    let geet = function() {
       console.log("hello");
    }
    geet();
     // function ka name nahi hy 
    // variable geet throw print ho rha hy 
</script>
<!-- ===================================================================================== -->

<!-- Anonymous function with perameter -->

<script>
   let greet = function(name){
    console.log("Hello " + name);
};
greet("sp");
</script>

<!-- ==================================================================================== -->

<!-- Anonymous function with event -->

    <button id="btn">Click Me</button>

    <script>
        document.getElementById("btn").onclick = function(){
            alert("Button clicked movement");
        };
    </script>

<!-- ======================================================================================== -->

    <!-- Anonymous function in settime out -->
     <script>
        setTimeout(function(){
       console.log("Hello after 2 seconds");
}, 2000); // 2000 => 2s     

     </script>
     
     <script>
        setTimeout(function(){
            console.log("keep larining javascript 1 seconds  ");

        } , 1000);// 1000 => 1s

     </script>  


<!-- =========================================================================================== -->

<!-- nested callback -->
 <script>
    setTimeout(function(){
  console.log("hello learning html");

  setTimeout(function(){
    console.log("hello larning css ");

    setTimeout(function(){
      console.log("hello laerning javascript ");
    }, 1000);

  }, 1000);

}, 1000);
 </script>
