    <!-- console me print -->
    <script>
        function addNumbers(a, b){

     addNumbers(5, 3);
     addNumbers(9 , 2); // reusable function

    <h2>Simple Function Demo</h2>

    <button onclick="showMessage()">Click Me</button>

    <p id="output"></p>
    

    <script>
        function showMessage(){
        document.getElementById("output").innerHTML = "Hello, this is my first function!";
        }
    </script>
