<!--
JavaScript can "display" data in different ways:

Writing into an HTML element, using innerHTML.
Writing into the HTML output using document.write().
Writing into an alert box, using window.alert().
Writing into the browser console, using console.log().
-->

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>


<script>
document.write(5 + 6);
</script>

<!-- inner html => webpage par data dikhane ke liye use hota hy. -->

<h1 id="demo"></h1>
<script>
document.getElementById("demo").innerHTML = 'Hello';
</script>

<!-- direct page par => htmll me direct page pr likte hy  -->
 <script>
    document.write("hello js ");
 </script>


<!-- popup box => user ko msg dikhane ke liye  -->
<script>
window.alert("Hi this is alert");
</script>

<!-- consol => debugging ke liye use  -->
<script>
console.log(5+6);
console.log(8+6);
</script>

<!-- console.error() / console.warn() => error or wornig show ke liye  -->
<script>
console.error("This is an error");
console.warn("This is a warning");
</script>


</body>
</html>
