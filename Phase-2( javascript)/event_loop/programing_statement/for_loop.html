 <!-- * revese number using for loop -->
  <script>
    let num = 1234;
    let reverse = 0;
    for(;num >0;){
        let digit = num %10;
        reverse = reverse * 10 + digit;
        num = Math.floor(num / 10);
    }
    console.log(reverse);
    document.write("reverse number:"+ reverse);
  </script>

  <!-- * check prime number is or not in console... -->

  <script>
    let numm =12;
    let isprime = true;
    for(let i=2;i<numm;i++){
        if(numm % i=== 0){
            isprime = false;
            break;
        }
    }
    if (isprime && numm >1){
        console.log("prime number");//(2,3,5,7,11)
    }else{
        console.log("not prime");//(4,6,8,9)
    }
  </script><br/><br/>

<script>

 <script>

   console.log(a);
