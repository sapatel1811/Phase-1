<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<!-- => for of loop ye itrable project(like: string , array , map , set) ke value par
 pair itret karta hy
 => major diffrance : value deta hy 

 * syntex : for (let value of itrable){
    //code....
 }

 * use case :
 => jab aap ko actual value chiye
 => array , string , map ke liye best -->

 <!-- ================================================================================== -->

 <!-- EXample_1) array ke stah  -->
  <script>
    const fruits = ["apple" , "banana" , "mango"];
    for (let fruit of fruits){
        console.log(fruit);
        document.write(fruit + "<br>");
    }
  </script><br><br>

<!-- ======================================================================================== -->

<!-- Example_2) string ke sath  -->
 <script>
    const name = "sapna";
    for (let char of name){
        console.log(char);
        document.write(char + "<br>");
    }
 </script>


</body>
</html>
